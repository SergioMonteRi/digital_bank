repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: ruff check
        language: system
        types: [python]
        args:
          - --fix

      - id: ruff-format
        name: Ruff format
        entry: ruff format
        language: system
        types: [python]

      - id: pylint
        name: Pylint
        entry: pylint
        language: system
        types: [python]
        args:
          - "-rn"
          - "-sn"
          - "--rcfile=.pylintrc"
          - "--load-plugins=pylint.extensions.docparams"